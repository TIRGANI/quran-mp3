name: Générer les horaires mot par mot (alignement audio/texte)

# Génère scripts/timings/<récitateur>/<sourate>.json (cf. scripts/align_quran.py) : horaires mot
# par mot exacts, alignés directement sur les fichiers mp3quran.net réellement joués par l'app.
# Tourne par tranches de temps bornées (limite GitHub Actions : 6h par job) et reprend là où elle
# s'était arrêtée à chaque lancement (les sourates déjà générées sont ignorées), jusqu'à ce que
# tout soit fait.

on:
  schedule:
    - cron: '0 3 * * *' # tous les jours à 3h UTC
  workflow_dispatch:
    inputs:
      reciters:
        description: 'IDs des récitateurs (séparés par des virgules)'
        default: 'mishary-alafasy/r1,abdulbasit-abdulsamad/r3,mahmoud-husary/r1,muhammad-minshawi/r1,abdulrahman-sudais/r1,saud-shuraim/r1'
      time_budget_min:
        description: 'Budget de temps en minutes avant arrêt propre'
        default: '320'

permissions:
  contents: write

concurrency:
  group: align-quran
  cancel-in-progress: false

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Installer ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1

      - name: Installer les dépendances Python
        run: pip install -r scripts/requirements.txt

      - name: Cache du modèle d'alignement (~1.2 Go, téléchargé une seule fois)
        uses: actions/cache@v4
        with:
          path: ~/ctc_forced_aligner
          key: ctc-forced-aligner-model-v1

      - name: Générer les horaires
        working-directory: scripts
        run: |
          python align_quran.py \
            --reciters "${{ github.event.inputs.reciters || 'mishary-alafasy/r1,abdulbasit-abdulsamad/r3,mahmoud-husary/r1,muhammad-minshawi/r1,abdulrahman-sudais/r1,saud-shuraim/r1' }}" \
            --surahs 1-114 \
            --time-budget-min "${{ github.event.inputs.time_budget_min || '320' }}" \
            -v

      - name: Publier les horaires générés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/timings
          if git diff --cached --quiet; then
            echo "Rien de nouveau à publier."
          else
            n=$(git diff --cached --name-only | wc -l | tr -d ' ')
            git commit -m "Horaires générés automatiquement ($n fichiers)"
            git pull --rebase origin master
            git push origin master
          fi

      - name: Journal des échecs (si présent)
        if: always()
        run: cat scripts/align_failures.log 2>/dev/null || echo "Aucun échec."
